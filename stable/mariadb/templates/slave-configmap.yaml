{{- if and .Values.replication.enabled .Values.slave.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "slave.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: "{{ template "mariadb.name" . }}"
    component: "slave"
    chart: "{{ template "mariadb.chart" . }}"
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
data:
  my.cnf: |-
{{ .Values.slave.config | indent 4 }}
{{- if .Values.master.masterCaConfigMap }}
    [client]
    ssl_ca=/bitnami/mariadb/tls/ca/ca.crt
{{- end }}
  backup.sh: |-
{{ .Files.Get "backup.sh" | indent 4 }}
{{- end }}
