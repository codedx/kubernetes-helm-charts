{{- if .Values.priorityClass.master.create -}}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ include "mariadb.master.priorityClassName" . | quote }}
value: {{ .Values.master.priorityClass.value }}
globalDefault: false
description: "The priority class for the MariaDB master database."
{{- end -}}